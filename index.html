<script>
/* =====================================================================================
   GOLD HUNTER — v2.0.0
   معماری: Data Provider (قابل تعویض) → Technical Engine → Fundamental Engine →
            Market Regime → Breakout Engine → Risk Engine → Rule Engine → AI Analyst → UI
   قانون طلایی: هیچ داده Live ساختگی نمایش داده نمی‌شود. هر عددی که از DEMO می‌آید
   با برچسب ⚠ DEMO مشخص است و هرگز به‌جای LIVE نشان داده نمی‌شود.
===================================================================================== */

// =========================== 0. CONFIG ===========================
const CONFIG = {
  SYMBOL: 'XAU/USD',
  // اگر Backend Proxy (پوشه /server) را اجرا کردی، آدرس آن را این‌جا یا در صفحه تنظیمات وارد کن.
  // مثال: 'http://localhost:8787'  یا آدرس دامنه‌ای که پروکسی را روی آن دیپلوی کردی.
  DEFAULT_API_BASE_URL: '',
  MIN_ACCEPTABLE_RR: 2,
  NEWS_RISK_WINDOW_HOURS: 12
};
const STATUS = { LIVE: 'LIVE', DELAYED: 'DELAYED', UNAVAILABLE: 'UNAVAILABLE', DEMO: 'DEMO' };
const STATUS_META = {
  LIVE: { cls: 'tag-live', label: '🟢 LIVE' },
  DELAYED: { cls: 'tag-delayed', label: '🟡 DELAYED' },
  UNAVAILABLE: { cls: 'tag-unavailable', label: '🔴 داده زنده در دسترس نیست' },
  DEMO: { cls: 'tag-demo', label: '⚠ DEMO DATA' }
};
const TIMEFRAMES = ['Weekly', 'Daily', '4H', '15M'];

// =========================== 1. DATA PROVIDER LAYER ===========================
// هر Provider باید getQuote / getOHLC / getEconomicCalendar را پیاده‌سازی کند
// و همیشه یک فیلد status از نوع STATUS برگرداند. هرگز نباید داده قدیمی را LIVE جا بزند.

class DataProvider {
  async getQuote(symbol) { throw new Error('not implemented'); }
  async getOHLC(symbol, timeframe, limit) { throw new Error('not implemented'); }
  async getEconomicCalendar() { throw new Error('not implemented'); }
}

// ---- DEMO Provider: داده تصادفیِ سیدشده (Seeded) — هرگز ادعای Live ندارد ----
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

class DemoDataProvider extends DataProvider {
  constructor(seed) {
    super();
    this.seed = seed || Date.now() % 1000000;
    this.rng = mulberry32(this.seed);
    this._barsCache = {};
  }
  regenerate(seed) {
    this.seed = seed || Date.now() % 1000000;
    this.rng = mulberry32(this.seed);
    this._barsCache = {};
  }
  _genBars(timeframe, count) {
    const key = timeframe + ':' + count;
    if (this._barsCache[key]) return this._barsCache[key];
    const tfSeconds = { '15M': 900, '1H': 3600, '4H': 14400, 'Daily': 86400, 'Weekly': 604800 }[timeframe] || 14400;
    let price = 4600 + this.rng() * 100;
    const bars = [];
    const now = Math.floor(Date.now() / 1000);
    const startTime = now - count * tfSeconds;
    // یک روند صعودی ملایم پس‌زمینه به‌علاوه نویز، تا رفتار Regime/Breakout قابل مشاهده باشد
    for (let i = 0; i < count; i++) {
      const drift = 0.14 + Math.sin(i / 18) * 0.35;
      const noise = (this.rng() - 0.5) * 9;
      const open = price;
      const close = open + drift + noise;
      const high = Math.max(open, close) + this.rng() * 4;
      const low = Math.min(open, close) - this.rng() * 4;
      const volume = 800 + this.rng() * 1200 + (Math.abs(close - open) > 5 ? 600 : 0);
      bars.push({ time: startTime + i * tfSeconds, open, high, low, close, volume });
      price = close;
    }
    this._barsCache[key] = bars;
    return bars;
  }
  async getQuote(symbol) {
    const bars = this._genBars('15M', 50);
    const last = bars[bars.length - 1];
    const prev = bars[0];
    return {
      status: STATUS.DEMO, symbol,
      price: last.close, change: last.close - prev.close,
      changePercent: ((last.close - prev.close) / prev.close) * 100,
      high: Math.max(...bars.map(b => b.high)), low: Math.min(...bars.map(b => b.low)),
      fetchedAt: new Date().toISOString()
    };
  }
  async getOHLC(symbol, timeframe, limit) {

// ---- REST Provider: اتصال واقعی از طریق Backend Proxy (پوشه /server) ----
class RestApiDataProvider extends DataProvider {
  constructor(baseUrl) { super(); this.baseUrl = (baseUrl || '').replace(/\/$/, ''); this.lastError = null; }
  async _get(path, timeoutMs) {
    if (!this.baseUrl) return { status: STATUS.UNAVAILABLE, error: 'api-base-url-not-set' };
    try {
      const ctrl = new AbortController();
      // پلن رایگان Render (و مشابه) پس از بی‌کاری «می‌خوابد» و اولین درخواست ممکن است
      // تا ۵۰-۶۰ ثانیه طول بکشد تا سرور بیدار شود — پس تایم‌اوت را سخاوتمندانه در نظر می‌گیریم.
      const timer = setTimeout(() => ctrl.abort(), timeoutMs || 45000);
      const r = await fetch(this.baseUrl + path, { signal: ctrl.signal });
      clearTimeout(timer);
      if (!r.ok) { this.lastError = 'http-' + r.status; return { status: STATUS.UNAVAILABLE, error: this.lastError }; }
      return await r.json();
    } catch (e) {
      this.lastError = (e && e.name === 'AbortError') ? 'timeout (سرور در ۴۵ ثانیه پاسخ نداد)' : 'fetch-exception: ' + (e && e.message ? e.message : String(e));
      return { status: STATUS.UNAVAILABLE, error: this.lastError };
    }
  }
  async getQuote(symbol) { return this._get(`/api/market/quote?symbol=${encodeURIComponent(symbol)}`); }
  async getOHLC(symbol, timeframe, limit) {
    return this._get(`/api/market/ohlc?symbol=${encodeURIComponent(symbol)}&timeframe=${timeframe}&limit=${limit || 200}`);
  }
  async getEconomicCalendar() { return this._get('/api/calendar'); }
}

// ---- XAUS Provider: اتصال ساده و مستقیم از مرورگر — بدون کلید، بدون سرور واسط ----
// xaus.com API صراحتاً CORS باز دارد و برای فراخوانی مستقیم از جاوااسکریپت مرورگر طراحی شده
// (بدون کلید، بدون ثبت‌نام). قیمت لحظه‌ای + تاریخچه روزانه واقعی (تا ۵ سال) از همین سرویس می‌آید.
// محدودیت شناخته‌شده: این سرویس کندل اینترادی (۱۵دقیقه/۱ساعته/۴ساعته) ندارد — فقط روزانه —
// پس تایم‌فریم‌های Daily/Weekly واقعی می‌شوند و 4H/15M همچنان صادقانه روی DEMO باقی می‌مانند.
class XausProvider extends DataProvider {
  constructor() { super(); this.base = 'https://xaus.com/api/v1'; this.lastError = null; this.cachedQuote = null; this._historyCache = null; this._historyCacheAt = 0; }
  async _get(path) {
    try {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 10000);
      const r = await fetch(this.base + path, { signal: ctrl.signal, mode: 'cors' });
      clearTimeout(timer);
      if (!r.ok) { this.lastError = 'http-' + r.status; return null; }
      return await r.json();
    } catch (e) {
      this.lastError = (e && e.name === 'AbortError') ? 'timeout' : 'fetch-exception: ' + (e && e.message ? e.message : String(e));
      return null;
    }
  }
  // /v1/history فقط یک‌بار در هر بازه کوتاه (۶۰ ثانیه) واقعاً فراخوانی می‌شود و بین
  // getQuote و getOHLC(Daily) و getOHLC(Weekly) به اشتراک گذاشته می‌شود — تا به Rate Limit سرویس نخوریم
  // و Daily/Weekly به‌اشتباه (به‌خاطر شکست درخواست تکراری) به DEMO سقوط نکنند.
  async _getHistoryCached() {
    const now = Date.now();
    if (this._historyCache && (now - this._historyCacheAt) < 60000) return this._historyCache;
    const hist = await this._get('/history');
    if (hist) { this._historyCache = hist; this._historyCacheAt = now; }
    return hist;
  }
  async getQuote(symbol) {
    this.lastError = null;
    const spot = await this._get('/spot?compact=1');
    if (!spot || spot.spot_usd_oz == null) return { status: STATUS.UNAVAILABLE, error: this.lastError || 'empty-response' };
    // data_state ممکن است در برخی نسخه‌های پاسخ نباشد؛ در آن صورت با فیلد stale (اگر بود) یا فرض «تازه» ادامه می‌دهیم
    const st = spot.data_state && spot.data_state.status;
    let status;
    if (st === 'fresh') status = STATUS.LIVE;
    else if (st === 'stale') status = STATUS.DELAYED;
    else if (st === 'unavailable') status = STATUS.UNAVAILABLE;
    else status = spot.stale === true ? STATUS.DELAYED : STATUS.LIVE;
    if (status === STATUS.UNAVAILABLE) { this.cachedQuote = null; return { status: STATUS.UNAVAILABLE, error: 'upstream-unavailable' }; }
    const hist = await this._getHistoryCached();
    let high = spot.spot_usd_oz, low = spot.spot_usd_oz, prevClose = spot.spot_usd_oz;
    if (hist && hist.ranges && hist.ranges.day) { high = hist.ranges.day.high; low = hist.ranges.day.low; }
    if (hist && Array.isArray(hist.points) && hist.points.length > 1) prevClose = hist.points[hist.points.length - 2].c;
    const result = {
      status, symbol, price: spot.spot_usd_oz, change: spot.spot_usd_oz - prevClose,
      changePercent: prevClose ? ((spot.spot_usd_oz - prevClose) / prevClose) * 100 : 0,
      high, low, fetchedAt: spot.updated_at || new Date().toISOString()
    };
    this.cachedQuote = result; // برای هم‌راستا کردن کندل «امروز» در getOHLC با قیمت لحظه‌ای واقعی
    return result;
  }
  async getOHLC(symbol, timeframe, limit) {
    if (timeframe !== 'Daily' && timeframe !== 'Weekly') {
      // اینترادی در این سرویس رایگان موجود نیست — به‌صراحت UNAVAILABLE (نه داده جعلی)
      return { status: STATUS.UNAVAILABLE, error: 'intraday-not-available-free' };
    }
    const hist = await this._getHistoryCached();
    if (!hist || !Array.isArray(hist.points) || hist.points.length < 5) return { status: STATUS.UNAVAILABLE, error: this.lastError || 'no-history' };
    const sortedPoints = hist.points.slice().sort((a, b) => new Date(a.d) - new Date(b.d));
    const daily = sortedPoints.map((p, i) => ({
      time: Math.floor(new Date(p.d + 'T00:00:00Z').getTime() / 1000),
      open: i > 0 ? sortedPoints[i - 1].c : p.c, // بدون فیلد Open در API؛ close روز قبل نزدیک‌ترین تقریب واقعی است
      high: p.h, low: p.l, close: p.c, volume: 0
    }));
    // هم‌راستا کردن آخرین کندل روزانه با قیمت لحظه‌ای واقعی (اگر همان روز باشد، به‌روزرسانی؛ وگرنه کندل «امروز» اضافه می‌شود)
    if (this.cachedQuote) {
      const todayKey = new Date().toISOString().slice(0, 10);
      const lastBar = daily[daily.length - 1];
      const lastBarKey = new Date(lastBar.time * 1000).toISOString().slice(0, 10);
      if (lastBarKey === todayKey) {
        lastBar.close = this.cachedQuote.price;
        lastBar.high = Math.max(lastBar.high, this.cachedQuote.price);
        lastBar.low = Math.min(lastBar.low, this.cachedQuote.price);
      } else {
        daily.push({
          time: Math.floor(Date.now() / 1000), open: lastBar.close,
          high: Math.max(this.cachedQuote.high, this.cachedQuote.price, lastBar.close),
          low: Math.min(this.cachedQuote.low, this.cachedQuote.price, lastBar.close),
          close: this.cachedQuote.price, volume: 0
        });
      }
    }
    let bars = daily;
    if (timeframe === 'Weekly') {
      // گروه‌بندی هفتگی واقعی (هفته میلادی از دوشنبه) — نه تقریب تقویمی
      const weeks = {};
      daily.forEach(b => {
        const d = new Date(b.time * 1000);
        const day = d.getUTCDay(); // 0=یکشنبه..6=شنبه
        const diffToMonday = (day === 0 ? -6 : 1) - day;
        const monday = new Date(d); monday.setUTCDate(d.getUTCDate() + diffToMonday); monday.setUTCHours(0, 0, 0, 0);
        const weekKey = monday.toISOString().slice(0, 10);
        if (!weeks[weekKey]) weeks[weekKey] = [];
        weeks[weekKey].push(b);
      });
      bars = Object.keys(weeks).sort().map(k => {
        const group = weeks[k];
        return {
          time: group[0].time, open: group[0].open, close: group[group.length - 1].close,
          high: Math.max(...group.map(b => b.high)), low: Math.min(...group.map(b => b.low)), volume: 0
        };
      });
    }
    return { status: STATUS.LIVE, symbol, timeframe, bars: bars.slice(-(limit || 200)) };
  }
  async getEconomicCalendar() { return { status: STATUS.UNAVAILABLE, error: 'not-supported-by-this-provider' }; }
}

// =========================== 2. TECHNICAL INDICATOR ENGINE ===========================
// این توابع روی داده واقعی Provider (DEMO یا LIVE) اجرا می‌شوند — عدد ثابت/دستی نیستند.

function calcEMA(closes, period) {
  if (!closes.length) return null;
  const k = 2 / (period + 1);
  let ema = closes[0];
  for (let i = 1; i < closes.length; i++) ema = closes[i] * k + ema * (1 - k);
  return ema;
}
function calcRSI(closes, period) {
  period = period || 14;
  if (closes.length < period + 1) return 50;
  let gains = 0, losses = 0;
  for (let i = closes.length - period; i < closes.length; i++) {
    const diff = closes[i] - closes[i - 1];
    if (diff >= 0) gains += diff; else losses -= diff;
  }
  const avgGain = gains / period, avgLoss = losses / period;
  if (avgLoss === 0) return 100;
  const rs = avgGain / avgLoss;
  return 100 - 100 / (1 + rs);
}
function calcSupportResistance(bars, lookback) {
  const slice = bars.slice(-(lookback || 40));
  return { support: Math.min(...slice.map(b => b.low)), resistance: Math.max(...slice.map(b => b.high)) };
}
function avgVolume(bars, n) { const s = bars.slice(-n); return s.reduce((a, b) => a + b.volume, 0) / (s.length || 1); }
function trendLabel(closes, ema20) {
  const last = closes[closes.length - 1];
  const prior = closes[Math.max(0, closes.length - 10)];
  const slopeUp = last > prior;
  if (last > ema20 && slopeUp) return { key: 'UP', label: 'صعودی' };
  if (last < ema20 && !slopeUp) return { key: 'DOWN', label: 'نزولی' };
  return { key: 'NEUTRAL', label: 'خنثی' };
}

function buildTechnicalFrame(bars) {
  const closes = bars.map(b => b.close);
  const ema20 = calcEMA(closes.slice(-60), 20);
  const rsi = calcRSI(closes, 14);
  const sr = calcSupportResistance(bars, 40);
  const vol = avgVolume(bars, 20);
  const recentVol = avgVolume(bars, 5);
  const trend = trendLabel(closes, ema20);
  return {
    price: closes[closes.length - 1], trend: trend.label, trendKey: trend.key,
    ema20, rsi, support: sr.support, resistance: sr.resistance,
    volumeState: recentVol > vol * 1.1 ? 'بالاتر از میانگین' : recentVol < vol * 0.9 ? 'کاهشی' : 'نرمال',
    volumeConfirmed: recentVol > vol * 1.05,
    bars
  };
}

// =========================== 3. MARKET REGIME ENGINE ===========================
function detectRegime(techByTF) {
  const d = techByTF['Daily'], h4 = techByTF['4H'];
  const rangeWidthPct = ((d.resistance - d.support) / d.price) * 100;
  let regime, label, color, tag;
  if (d.trendKey === 'UP' && h4.trendKey !== 'DOWN') { regime = 'TREND_UP'; label = 'روند صعودی'; color = 'var(--bullish)'; tag = 'tag-bullish'; }
  else if (d.trendKey === 'DOWN' && h4.trendKey !== 'UP') { regime = 'TREND_DOWN'; label = 'روند نزولی'; color = 'var(--bearish)'; tag = 'tag-bearish'; }
  else if (rangeWidthPct < 4.5) { regime = 'RANGE'; label = 'رنج (بدون روند مشخص)'; color = 'var(--neutral)'; tag = 'tag-neutral'; }
  else { regime = 'TRANSITION'; label = 'گذار / نامشخص'; color = 'var(--neutral)'; tag = 'tag-neutral'; }
  const strength = Math.max(5, Math.min(95, Math.round(100 - rangeWidthPct * 6 + (d.trendKey !== 'NEUTRAL' ? 20 : 0))));
  return { regime, label, color, tag, strength, rangeWidthPct };
}

// =========================== 4. BREAKOUT ENGINE ===========================
function evaluateBreakout(techByTF, majorResistance) {
  const h4 = techByTF['4H'], m15 = techByTF['15M'];
  const stage1 = h4.price >= majorResistance * 0.998;                       // رسیدن قیمت به مقاومت
  const stage2 = h4.bars[h4.bars.length - 1].close > majorResistance;       // بسته‌شدن 4H بالای مقاومت
  const recentLow = Math.min(...h4.bars.slice(-4).map(b => b.low));
  const stage3 = stage2 && recentLow <= majorResistance * 1.01;             // ریتست
  const stage4 = stage2 && recentLow >= majorResistance * 0.995;            // حفظ سطح پس از ریتست
  const stage5 = m15.trendKey === 'UP' && m15.price > m15.ema20;            // تأیید ورود 15M
  const stage6 = m15.volumeConfirmed;                                       // تأیید حجم
  const stage7 = h4.rsi > 50;                                               // RSI بالای ۵۰
  const stage8 = h4.price > h4.ema20;                                       // قیمت بالای EMA20
  const stages = [
    { t: 'رسیدن قیمت به سطح مقاومت', done: stage1 },
    { t: 'بسته‌شدن کندل ۴ساعته بالای مقاومت', done: stage2 },
    { t: 'انجام ریتست روی سطح', done: stage3 },
    { t: 'حفظ سطح پس از ریتست', done: stage4 },
    { t: 'تأیید ورود در ۱۵ دقیقه', done: stage5 },
    { t: 'تأیید حجم (Volume Confirmation)', done: stage6 },
    { t: 'RSI ۴ساعته بالای ۵۰', done: stage7 },
    { t: 'قیمت بالای EMA20 در ۴ساعته', done: stage8 }
  ];
  const doneCount = stages.filter(s => s.done).length;
  const confirmed = doneCount === stages.length;
  const partial = stage1 && stage2 && !confirmed;
  const fakeRisk = partial && !stage6; // شکسته اما بدون تأیید حجم → ریسک Fake Breakout
  return { level: majorResistance, stages, confirmed, fakeRisk, progress: doneCount + '/' + stages.length };
}

// =========================== 5. RANGE MODE ===========================
function evaluateRange(techByTF) {
  const d = techByTF['Daily'];
  const high = d.resistance, low = d.support, mid = (high + low) / 2;
  const price = techByTF['4H'].price;
  const pos = (price - low) / (high - low); // 0..1
  let zone;
  if (pos < 0.1) zone = 'نزدیک کف رنج';
  else if (pos > 0.9) zone = 'نزدیک سقف رنج';
  else if (pos > 0.4 && pos < 0.6) zone = 'میانه رنج (Mid Range)';
  else zone = 'داخل محدوده رنج';
  return { high, low, mid, position: pos, zone, isMidRange: pos > 0.4 && pos < 0.6 };
}

// =========================== 6. NEWS RISK ENGINE ===========================
function evaluateNewsRisk(calendarResult) {
  if (!calendarResult || calendarResult.status === STATUS.UNAVAILABLE) {
    return { score: 5, label: 'نامشخص (تقویم در دسترس نیست)', high: false, hours: null };
  }
  const hours = calendarResult.hoursToNextHighImpact;
  if (hours == null) return { score: 3, label: 'پایین', high: false, hours: null };
  if (hours <= CONFIG.NEWS_RISK_WINDOW_HOURS) {
    return { score: 8.5, label: `بالا — خبر مهم تا ${hours} ساعت آینده`, high: true, hours };
  }
  return { score: 3.5, label: 'پایین — خبر مهم نزدیک نیست', high: false, hours };
}

// =========================== 7. FUNDAMENTAL ENGINE ===========================
function evaluateFundamental(events) {
  const released = events.filter(e => e.a !== '—');
  let bullish = 0, bearish = 0, neutral = 0;
  released.forEach(e => {
    const p = parseFloat(e.p), a = parseFloat(e.a);
    if (isNaN(p) || isNaN(a)) { neutral++; return; }
    // قانون ساده و شفاف: داده تورمی/اشتغال بالاتر از انتظار => فشار بر طلا (Bearish)، پایین‌تر => Bullish
    const inflationLike = /CPI|PPI|PCE|NFP|Fed|فدرال|DXY|US10Y/i.test(e.t);
    if (!inflationLike) { neutral++; return; }
    if (a < p) bullish++; else if (a > p) bearish++; else neutral++;
  });
  const total = Math.max(1, bullish + bearish + neutral);
  const score = Math.round(((bullish * 10 + neutral * 5 + bearish * 1) / total / 10) * 100) / 10;
  const bias = bullish > bearish ? 'bullish' : bearish > bullish ? 'bearish' : 'neutral';
  const reasons = [];
  if (bullish > 0) reasons.push(`${bullish} رویداد اقتصادی منتشرشده پایین‌تر از پیش‌بینی بوده که برای طلا Bullish تلقی می‌شود.`);
  if (bearish > 0) reasons.push(`${bearish} رویداد اقتصادی منتشرشده بالاتر از پیش‌بینی بوده که برای طلا Bearish تلقی می‌شود.`);
  if (released.length < events.length) reasons.push(`${events.length - released.length} رویداد هنوز منتشر نشده (Actual: —) و در امتیاز فاندامنتال لحاظ نشده است.`);
  if (!reasons.length) reasons.push('داده اقتصادی کافی برای نتیجه‌گیری قطعی منتشر نشده است.');
  return { bias, score, reasons };
}

// =========================== 8. RISK ENGINE ===========================
function calcPositionSize(f) {
  const errors = [];
  if (!(f.balance > 0)) errors.push('موجودی حساب باید عددی مثبت باشد.');
  if (!(f.risk > 0 && f.risk <= 100)) errors.push('درصد ریسک باید بین 0 تا 100 باشد.');
  if (!(f.entry > 0)) errors.push('قیمت ورود نامعتبر است.');
  if (!(f.sl > 0)) errors.push('حد ضرر نامعتبر است.');
  if (f.entry === f.sl) errors.push('حد ضرر نمی‌تواند برابر قیمت ورود باشد.');
  if (!(f.lev >= 1)) errors.push('اهرم باید حداقل ۱ باشد.');
  if (errors.length) return { valid: false, errors };
  const riskAmount = (f.balance * f.risk) / 100;
  const stopDist = Math.abs(f.entry - f.sl);
  const size = riskAmount / stopDist;
  const notional = size * f.entry;
  const margin = notional / f.lev;
  let rr = null, profit = null;
  if (f.tp > 0) { const rewardDist = Math.abs(f.tp - f.entry); profit = size * rewardDist; rr = rewardDist / stopDist; }
  return {
    valid: true, riskAmount: riskAmount.toFixed(2), stopDist: stopDist.toFixed(2), size: size.toFixed(4),
    notional: notional.toFixed(2), margin: margin.toFixed(2), profit: profit ? profit.toFixed(2) : null,
    rr: rr ? rr.toFixed(2) : null, acceptable: rr ? rr >= CONFIG.MIN_ACCEPTABLE_RR : null
  };
}

function structuralRR(techByTF, side) {
  const h4 = techByTF['4H'];
  const entry = h4.price;
  const sl = side === 'BUY' ? techByTF['Daily'].support : techByTF['Daily'].resistance;
  const target = side === 'BUY' ? techByTF['Daily'].resistance : techByTF['Daily'].support;
  const stopDist = Math.abs(entry - sl);
  const rewardDist = Math.abs(target - entry);
  const rr = stopDist > 0 ? rewardDist / stopDist : 0;
  return { entry, sl, target, rr };
}

// =========================== 9. RULE ENGINE (تصمیم نهایی) ===========================
function runRuleEngine(state) {
  const { techByTF, regime, breakout, range, newsRisk, fundamental } = state;
  const h4 = techByTF['4H'], m15 = techByTF['15M'];
  const checklist = [];
  let block = null;

  const distToResistance = ((techByTF['Daily'].resistance - h4.price) / h4.price) * 100;
  const distToSupport = ((h4.price - techByTF['Daily'].support) / h4.price) * 100;
  checklist.push(`فاصله تا مقاومت کلیدی روزانه: ${distToResistance.toFixed(2)}%`);
  checklist.push(`فاصله تا حمایت کلیدی روزانه: ${distToSupport.toFixed(2)}%`);

  if (range.isMidRange) { block = 'قیمت در میانه محدوده رنج (Mid Range) قرار دارد — ورود در این ناحیه ممنوع است.'; }

  const rrBuy = structuralRR(techByTF, 'BUY');
  const rrSell = structuralRR(techByTF, 'SELL');

  let candidate = null;
  if (!block) {
    if (regime.regime === 'TREND_UP' && m15.trendKey !== 'DOWN') candidate = 'BUY';
    else if (regime.regime === 'TREND_DOWN' && m15.trendKey !== 'UP') candidate = 'SELL';
    else if (regime.regime === 'RANGE') candidate = range.position > 0.85 ? 'SELL_RANGE' : range.position < 0.15 ? 'BUY_RANGE' : null;
  }

  if (!block && candidate === 'BUY') {
    if (distToResistance < 0.6) block = 'قیمت بیش از حد به مقاومت مهم نزدیک است — ریسک برخورد به مقاومت بالاست.';
    else if (!breakout.confirmed && distToResistance < 1.5) block = 'شکست معتبر مقاومت هنوز تأیید نشده (' + breakout.progress + ' مرحله) — تا تکمیل مراحل Breakout، خرید مجاز نیست.';
    else if (rrBuy.rr < CONFIG.MIN_ACCEPTABLE_RR) block = `نسبت ریسک به ریوارد ساختاری (1:${rrBuy.rr.toFixed(2)}) کمتر از حداقل قابل قبول (1:${CONFIG.MIN_ACCEPTABLE_RR}) است.`;
    else if (newsRisk.high) block = 'خبر اقتصادی مهم نزدیک است و ریسک نوسان بالاست — ورود توصیه نمی‌شود یا باید حجم کاهش یابد.';
  }
  if (!block && candidate === 'SELL') {
    if (distToSupport < 0.6) block = 'قیمت بیش از حد به حمایت مهم نزدیک است — ریسک برخورد به حمایت بالاست.';
    else if (rrSell.rr < CONFIG.MIN_ACCEPTABLE_RR) block = `نسبت ریسک به ریوارد ساختاری (1:${rrSell.rr.toFixed(2)}) کمتر از حداقل قابل قبول (1:${CONFIG.MIN_ACCEPTABLE_RR}) است.`;
    else if (newsRisk.high) block = 'خبر اقتصادی مهم نزدیک است و ریسک نوسان بالاست — ورود توصیه نمی‌شود یا باید حجم کاهش یابد.';
  }
  if (!block && candidate === 'BUY_RANGE' && !breakout.confirmed) block = 'در حالت رنج، بدون شکست معتبر کف/سقف، ورود صادر نمی‌شود.';
  if (!block && candidate === 'SELL_RANGE' && !breakout.confirmed) block = 'در حالت رنج، بدون شکست معتبر کف/سقف، ورود صادر نمی‌شود.';

  let decision = 'WAIT', reason;
  if (block) { reason = block; }
  else if (candidate === 'BUY' || candidate === 'BUY_RANGE') { decision = 'BUY'; reason = 'روند، ساختار چندتایم‌فریمی، Breakout، ریسک/ریوارد و ریسک خبری همگی شرایط ورود خرید را تأیید می‌کنند.'; }
  else if (candidate === 'SELL' || candidate === 'SELL_RANGE') { decision = 'SELL'; reason = 'روند، ساختار چندتایم‌فریمی، ریسک/ریوارد و ریسک خبری شرایط ورود فروش را تأیید می‌کنند.'; }
  else { reason = 'هم‌راستایی کافی بین تایم‌فریم‌ها یا سیگنال ورود مشخصی وجود ندارد — بهترین اقدام، صبر کردن است.'; }

  return {
    decision, reason, checklist,
    rr: decision === 'SELL' ? rrSell.rr : rrBuy.rr,
    distToResistance, distToSupport
  };
}

// =========================== 10. HUNTER SCORE ===========================
function calcHunterScore(state, weights) {
  const w = weights;
  const technicalScore = clamp10((state.techByTF['4H'].rsi / 100) * 10 * 0.5 + (state.regime.strength / 100) * 10 * 0.5);
  const regimeScore = clamp10(state.regime.strength / 10);
  const rrScore = clamp10((state.decision.rr || 0) * 2);
  const newsScore = clamp10(10 - state.newsRisk.score);
  const fundamentalScore = clamp10(state.fundamental.score);
  const scores = { technical: technicalScore, fundamental: fundamentalScore, regime: regimeScore, riskReward: rrScore, news: newsScore };
  const hs = Math.round((scores.technical * w.technical + scores.fundamental * w.fundamental + scores.regime * w.regime +
    scores.riskReward * w.riskReward + scores.news * w.news) * 10) / 10;
  return { scores, hunterScore: hs };
}
function clamp10(v) { return Math.max(0, Math.min(10, Math.round(v * 10) / 10)); }

// =========================== 11. AI ANALYST LAYER ===========================
// AI هرگز قیمت تولید نمی‌کند؛ فقط ورودی ساختاریافته موتورهای بالا را دریافت و تفسیر می‌کند.
function buildAIPayload(state) {
  return {
    price: state.quote.price, dataStatus: state.quote.status,
    weekly: summarizeTF(state.techByTF['Weekly']), daily: summarizeTF(state.techByTF['Daily']),
    h4: summarizeTF(state.techByTF['4H']), m15: summarizeTF(state.techByTF['15M']),
    marketRegime: state.regime.regime, breakoutStatus: state.breakout.progress,
    fakeBreakoutRisk: state.breakout.fakeRisk, rangeStatus: state.range.zone,
    fundamentalBias: state.fundamental.bias, newsRisk: state.newsRisk.label,
    riskReward: state.decision.rr, finalDecision: state.decision.decision
  };
}
function summarizeTF(t) { return { trend: t.trend, ema20: round2(t.ema20), rsi: round2(t.rsi), support: round2(t.support), resistance: round2(t.resistance) }; }
function round2(n) { return Math.round(n * 100) / 100; }

function localAINarrative(state) {
  const p = buildAIPayload(state);
  const parts = [];
  parts.push(`قیمت فعلی ${round2(p.price)} در رژیم «${state.regime.label}» قرار دارد.`);
  parts.push(`هم‌راستایی تایم‌فریم‌ها: Weekly ${p.weekly.trend} / Daily ${p.daily.trend} / 4H ${p.h4.trend} / 15M ${p.m15.trend}.`);
  parts.push(`وضعیت Breakout: ${p.breakoutStatus} مرحله تکمیل${p.fakeBreakoutRisk ? ' — ریسک Fake Breakout شناسایی شد' : ''}.`);
  parts.push(`ریسک خبری: ${p.newsRisk}. بایاس فاندامنتال: ${p.fundamentalBias === 'bullish' ? 'صعودی' : p.fundamentalBias === 'bearish' ? 'نزولی' : 'خنثی'}.`);
  parts.push(`نتیجه Rule Engine: ${p.finalDecision}. ${state.decision.reason}`);
  return parts.join(' ');
}

async function getAIAnalysis(state, apiBaseUrl) {
  if (!apiBaseUrl) return { status: STATUS.DEMO, narrative: localAINarrative(state), source: 'Rule-Based Local Synthesis' };
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 12000);
    const r = await fetch(apiBaseUrl.replace(/\/$/, '') + '/api/ai/analyze', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ state: buildAIPayload(state) }), signal: ctrl.signal
    });
    clearTimeout(timer);
    if (!r.ok) throw new Error('http-' + r.status);
    const data = await r.json();
    if (data.status !== STATUS.LIVE || !data.narrative) {
      return { status: STATUS.DEMO, narrative: localAINarrative(state), source: 'Rule-Based Local Synthesis (AI واقعی در دسترس نیست)' };
    }
    return { status: STATUS.LIVE, narrative: data.narrative, source: 'AI API متصل' };
  } catch (e) {
    return { status: STATUS.DEMO, narrative: localAINarrative(state), source: 'Rule-Based Local Synthesis (AI واقعی در دسترس نیست)' };
  }
}

// =========================== 12. ALERT ENGINE ===========================
function generateAlerts(state) {
  const alerts = [];
  const h4 = state.techByTF['4H'];
  if (state.decision.distToResistance < 1) alerts.push({ icon: '🎯', color: 'var(--bearish)', title: 'نزدیک شدن به مقاومت', desc: `فاصله فقط ${state.decision.distToResistance.toFixed(2)}٪ تا مقاومت کلیدی روزانه.` });
  if (state.decision.distToSupport < 1) alerts.push({ icon: '🎯', color: 'var(--bullish)', title: 'نزدیک شدن به حمایت', desc: `فاصله فقط ${state.decision.distToSupport.toFixed(2)}٪ تا حمایت کلیدی روزانه.` });
  if (state.breakout.confirmed) alerts.push({ icon: '🚀', color: 'var(--bullish)', title: 'Breakout تأیید شد', desc: `تمام ${state.breakout.stages.length} مرحله شکست مقاومت ${round2(state.breakout.level)} تکمیل شد.` });
  else if (state.breakout.stages[0].done) alerts.push({ icon: '⏳', color: 'var(--neutral)', title: 'در جریان Breakout', desc: `${state.breakout.progress} مرحله شکست تکمیل شده است.` });
  if (state.breakout.fakeRisk) alerts.push({ icon: '⚠️', color: 'var(--bearish)', title: 'ریسک Fake Breakout', desc: 'شکست سطح بدون تأیید حجم رخ داده — احتیاط کنید.' });
  if (h4.rsi > 70 || h4.rsi < 30) alerts.push({ icon: '📊', color: 'var(--neutral)', title: 'RSI در ناحیه افراطی', desc: `RSI تایم‌فریم 4H روی ${round2(h4.rsi)} است.` });
  if ((h4.price > h4.ema20) !== (state._prevAboveEma)) alerts.push({ icon: '📈', color: 'var(--gold)', title: 'عبور از EMA20', desc: `قیمت ${h4.price > h4.ema20 ? 'بالای' : 'زیر'} EMA20 در 4H قرار گرفت.` });
  if (state.newsRisk.high) alerts.push({ icon: '📰', color: 'var(--bearish)', title: 'خبر پرریسک نزدیک', desc: state.newsRisk.label });
  if (state.decision.rr && state.decision.rr < CONFIG.MIN_ACCEPTABLE_RR) alerts.push({ icon: '📉', color: 'var(--bearish)', title: 'افت نسبت ریسک/ریوارد', desc: `R:R فعلی 1:${state.decision.rr.toFixed(2)} کمتر از حداقل مجاز است.` });
  if (state.range.isMidRange) alerts.push({ icon: '🚫', color: 'var(--neutral)', title: 'میانه محدوده رنج', desc: 'طبق قوانین شکارچی طلا، ورود در Mid Range ممنوع است.' });
  if (!alerts.length) alerts.push({ icon: '🔕', color: 'var(--text-muted)', title: 'هشدار فعالی وجود ندارد', desc: 'در حال حاضر هیچ‌کدام از شرایط هشدار برقرار نیست.' });
  return alerts;
}

// =========================== 13. BACKTEST ENGINE ===========================
// اصل مهم: این بک‌تست دقیقاً همان توابع Rule Engine / Regime / Breakout / Range را که
// در تحلیل زنده استفاده می‌شوند فراخوانی می‌کند — نه یک استراتژی ساده‌شده جداگانه.
// این‌طور نتیجه بک‌تست واقعاً منعکس‌کننده رفتار همان سیستمی است که تصمیم زنده می‌سازد.
//
// محدودیت صادقانه: چون فقط یک سری کندل (معمولاً 4H) در دسترس است، تایم‌فریم‌های
// Daily و Weekly با تجمیع کندل‌های همان سری تقریب زده می‌شوند (نه داده مستقل واقعی)
// و 15M همان کندل 4H را (به‌عنوان نزدیک‌ترین تقریب) به‌کار می‌برد. این بک‌تست هم‌چنین
// اسپرد، کمیسیون و Slippage را مدل نمی‌کند — نتیجه واقعی معاملات همیشه بدتر از این است.

function aggregateBars(bars, groupSize) {
  const out = [];
  for (let i = 0; i < bars.length; i += groupSize) {
    const g = bars.slice(i, i + groupSize);
    if (!g.length) continue;
    out.push({
      time: g[0].time, open: g[0].open, close: g[g.length - 1].close,
      high: Math.max(...g.map(b => b.high)), low: Math.min(...g.map(b => b.low)),
      volume: g.reduce((s, b) => s + (b.volume || 0), 0)
    });
  }
  return out;
}

function runBacktest(bars4h) {
  if (!bars4h || bars4h.length < 120) return { ok: false, reason: 'داده تاریخی کافی برای بک‌تست معنادار در دسترس نیست (حداقل ۱۲۰ کندل ۴ساعته لازم است).' };

  let trades = [], position = null;
  // از کندل ۱۰۰ام شروع می‌کنیم تا تایم‌فریم‌های تجمیعی (Daily/Weekly) داده کافی برای محاسبه داشته باشند
  for (let i = 100; i < bars4h.length; i++) {
    const window4h = bars4h.slice(0, i + 1);
    const dailyApprox = aggregateBars(window4h, 6);   // ~۶ کندل ۴ساعته ≈ ۱ روز
    const weeklyApprox = aggregateBars(window4h, 42); // ~۷ روز ≈ ۱ هفته

    if (dailyApprox.length < 20 || weeklyApprox.length < 8) continue;

    let techByTF;
    try {
      techByTF = {
        'Weekly': buildTechnicalFrame(weeklyApprox),
        'Daily': buildTechnicalFrame(dailyApprox),
        '4H': buildTechnicalFrame(window4h),
        '15M': buildTechnicalFrame(window4h) // تقریب — داده اینترادی مستقل در دسترس نیست
      };
    } catch (e) { continue; }

    const price = window4h[window4h.length - 1].close;

    if (!position) {
      const regime = detectRegime(techByTF);
      const breakout = evaluateBreakout(techByTF, techByTF['Daily'].resistance);
      const range = evaluateRange(techByTF);
      const newsRisk = { score: 3, label: 'نامشخص در بک‌تست', high: false, hours: null }; // داده خبری تاریخی در دسترس نیست
      const fundamental = { bias: 'neutral', score: 5, reasons: [] };
      const decision = runRuleEngine({ techByTF, regime, breakout, range, newsRisk, fundamental });

      if (decision.decision === 'BUY') {
        const rr = structuralRR(techByTF, 'BUY');
        if (rr.rr >= CONFIG.MIN_ACCEPTABLE_RR) position = { side: 'BUY', entry: price, sl: rr.sl, target: rr.target };
      } else if (decision.decision === 'SELL') {
        const rr = structuralRR(techByTF, 'SELL');
        if (rr.rr >= CONFIG.MIN_ACCEPTABLE_RR) position = { side: 'SELL', entry: price, sl: rr.sl, target: rr.target };
      }
    } else {
      const hitSL = position.side === 'BUY' ? price <= position.sl : price >= position.sl;
      const hitTarget = position.side === 'BUY' ? price >= position.target : price <= position.target;
      if (hitSL || hitTarget || i === bars4h.length - 1) {
        const pl = position.side === 'BUY' ? price - position.entry : position.entry - price;
        const stopDist = Math.abs(position.entry - position.sl) || 1;
        trades.push({ pl, rMultiple: pl / stopDist, side: position.side });
        position = null;
      }
    }
  }

  const wins = trades.filter(t => t.pl > 0);
  const netPl = trades.reduce((s, t) => s + t.pl, 0);
  const grossProfit = wins.reduce((s, t) => s + t.pl, 0);
  const grossLoss = Math.abs(trades.filter(t => t.pl < 0).reduce((s, t) => s + t.pl, 0));
  let peak = 0, running = 0, maxDD = 0;
  trades.forEach(t => { running += t.pl; peak = Math.max(peak, running); maxDD = Math.max(maxDD, peak - running); });

  return {
    ok: true, totalTrades: trades.length, winRate: trades.length ? ((wins.length / trades.length) * 100).toFixed(1) : '0',
    netPl: netPl.toFixed(2), profitFactor: grossLoss > 0 ? (grossProfit / grossLoss).toFixed(2) : '—',
    avgR: trades.length ? (trades.reduce((s, t) => s + t.rMultiple, 0) / trades.length).toFixed(2) : '0',
    maxDrawdown: maxDD.toFixed(2), winningTrades: wins.length, losingTrades: trades.length - wins.length,
    barsAnalyzed: bars4h.length
  };
}

async function buildMarketState() {
  const provider = activeProviderFn();
  const simpleQuoteProvider = activeQuoteProviderFn();

  // هر Provider باید status:UNAVAILABLE برگرداند نه Exception پرتاب کند، اما به‌عنوان یک محافظ اضافه
  // (مثلاً در برابر پاسخ غیرمنتظره یک API واقعی)، هر Promise را با safeCall می‌پیچیم تا یک خطای
  // پیش‌بینی‌نشده در یک بخش، کل زنجیره Promise.all را نشکند و صفحه خالی نماند.
  const safeCall = (promiseFactory, fallbackLabel) =>
    Promise.resolve().then(promiseFactory).catch((e) => ({
      status: STATUS.UNAVAILABLE,
      error: `${fallbackLabel}-exception: ${e && e.message ? e.message : String(e)}`
    }));

  // همه درخواست‌ها (قیمت + ۴ تایم‌فریم + تقویم) هم‌زمان (موازی) فرستاده می‌شوند، نه پشت سر هم —
  // در حالت Backend Proxy با سرور خواب (Render رایگان)، اگر ۶ درخواست پشت‌سرهم با Timeout ۴۵ ثانیه‌ای
  // اجرا شوند، بارگذاری اول می‌تواند چند دقیقه طول بکشد و به‌نظر «هنگ‌کردن» بیاید. موازی‌سازی این را
  // به‌اندازه یک Timeout (حداکثر ~۴۵ ثانیه) کاهش می‌دهد.
  const quotePromise = safeCall(() => simpleQuoteProvider ? simpleQuoteProvider.getQuote(CONFIG.SYMBOL) : provider.getQuote(CONFIG.SYMBOL), 'quote');
  const ohlcPromises = TIMEFRAMES.map((tf) =>
    safeCall(() => simpleQuoteProvider ? simpleQuoteProvider.getOHLC(CONFIG.SYMBOL, tf, 200) : provider.getOHLC(CONFIG.SYMBOL, tf, 200), 'ohlc-' + tf)
      .then((ohlc) => ({ tf, ohlc }))
  );
  const calendarPromise = safeCall(() => provider.getEconomicCalendar(), 'calendar');

  let [quote, ohlcResults, calendarResult] = await Promise.all([quotePromise, Promise.all(ohlcPromises), calendarPromise]);

  let quoteError = null;
  // اگر هر یک از دو حالت اتصال (ساده یا Backend Proxy کامل) فعال است ولی خود قیمت لحظه‌ای شکست خورد
  // (شبکه/Rate Limit/غیره)، به‌جای غیرفعال‌کردن کل اپ، مثل بقیه سیستم به‌صورت شفاف روی DEMO برمی‌گردیم —
  // نه یک صفحه خالی «در دسترس نیست». شکست واقعی فقط وقتی نشان داده می‌شود که هیچ اتصالی اصلاً فعال نباشد.
  if ((simpleQuoteProvider || settings.useLive) && quote.status === STATUS.UNAVAILABLE) {
    quoteError = quote.error || 'unknown-error';
    quote = await demoProvider.getQuote(CONFIG.SYMBOL);
  }
  const techByTF = {};
  let dataStatus = quote.status;
  let unavailable = false;
  let technicalIsDemo = !!quoteError;

  // اگر هرکدام از تایم‌فریم‌ها شکست خورده باشند، به‌صورت موازی (نه پشت‌سرهم) از DEMO جایگزین می‌شوند
  const fallbackNeeded = ohlcResults.filter(({ ohlc }) => ohlc.status === STATUS.UNAVAILABLE || !ohlc.bars || !ohlc.bars.length);
  let fallbackResults = [];
  if (fallbackNeeded.length) {
    fallbackResults = await Promise.all(fallbackNeeded.map(({ tf }) => demoProvider.getOHLC(CONFIG.SYMBOL, tf, 200).then((ohlc) => ({ tf, ohlc }))));
    technicalIsDemo = true;
  }
  const fallbackMap = Object.fromEntries(fallbackResults.map((r) => [r.tf, r.ohlc]));

  for (const { tf, ohlc: originalOhlc } of ohlcResults) {
    const ohlc = fallbackMap[tf] || originalOhlc;
    if (ohlc.status === STATUS.UNAVAILABLE || !ohlc.bars || !ohlc.bars.length) { unavailable = true; continue; }
    techByTF[tf] = buildTechnicalFrame(ohlc.bars);
    techByTF[tf].source = ohlc.status; // برای نمایش تگ LIVE/DEMO مجزا به‌ازای هر تایم‌فریم در UI
  }
  // تگ وضعیت کلی همیشه سخت‌گیرانه‌ترین وضعیت را نشان می‌دهد: اگر تحلیل تکنیکال (که پایه تصمیم‌گیری است)
  // روی DEMO اجرا شود، وضعیت کلی هم DEMO است — حتی اگر خود قیمت لحظه‌ای Live باشد.
  if (technicalIsDemo) dataStatus = STATUS.DEMO;
  // «قیمت فعلی» هر تایم‌فریم باید با قیمت لحظه‌ای واقعی یکی باشد — نه آخرین کلوز کندل تاریخی
  // (که ممکن است چند ساعت قدیمی‌تر/کش‌شده باشد). حمایت/مقاومت/EMA/RSI هر تایم‌فریم دست‌نخورده می‌مانند،
  // فقط فیلد «price» با قیمت لحظه‌ای هماهنگ می‌شود تا در همه صفحات یکسان دیده شود.
  if (quote.price != null && (quote.status === STATUS.LIVE || quote.status === STATUS.DELAYED)) {
    Object.keys(techByTF).forEach((tf) => { techByTF[tf].price = quote.price; });
  }
  // تقویم اقتصادی همیشه به DEMO برمی‌گردد اگر در دسترس نباشد (مثلاً کلید تنظیم نشده)؛
  // نبود آن به‌تنهایی نباید کل داشبورد (قیمت/تکنیکال که ممکن است کاملاً Live باشند) را غیرفعال کند —
  // فقط خود تب فاندامنتال با تگ DEMO مشخص می‌شود.
  if (calendarResult.status === STATUS.UNAVAILABLE) calendarResult = await demoProvider.getEconomicCalendar();

  if (unavailable || Object.keys(techByTF).length < TIMEFRAMES.length) {
    return { unavailable: true, status: STATUS.UNAVAILABLE, quote, calendarResult, quoteError, usingProxy: settings.useLive && settings.apiBaseUrl };
  }

  const regime = detectRegime(techByTF);
  const breakout = evaluateBreakout(techByTF, techByTF['Daily'].resistance);
  const range = evaluateRange(techByTF);
  const newsRisk = evaluateNewsRisk(calendarResult);
  const fundamental = evaluateFundamental(calendarResult.events || []);
  const decision = runRuleEngine({ techByTF, regime, breakout, range, newsRisk, fundamental });
  const hunter = calcHunterScore({ techByTF, regime, decision, newsRisk, fundamental }, settings.weights);

  return {
    unavailable: false, status: dataStatus, quote, techByTF, regime, breakout, range,
    newsRisk, fundamental, decision, scores: hunter.scores, hunterScore: hunter.hunterScore,
    calendarResult, technicalIsDemo, quoteError,
    providerIsLive: (settings.useLive && settings.apiBaseUrl) || !!simpleQuoteProvider
  };
}

  const rangeP = Math.max(10, 100 - bullP - bearP);
  const scenarios = {
    bullish: { p: bullP, trigger: `بسته‌شدن معتبر بالای مقاومت ${round2(d.resistance)} همراه با تأیید حجم و RSI بالای ۵۰`, inv: `بازگشت زیر ${round2(h4.support)} در ۴ساعته`, entry: round2(d.resistance) + 5, sl: round2(h4.support), t1: round2(d.resistance + (d.resistance - d.support) * .2), t2: round2(d.resistance + (d.resistance - d.support) * .4), t3: round2(d.resistance + (d.resistance - d.support) * .7) },
    bearish: { p: bearP, trigger: `رد شدن مجدد از مقاومت ${round2(d.resistance)} همراه با کندل بازگشتی قوی`, inv: `شکست معتبر و تثبیت بالای ${round2(d.resistance)}`, entry: round2(h4.resistance), sl: round2(d.resistance) + 10, t1: round2(h4.support), t2: round2(d.support + (d.resistance - d.support) * .2), t3: round2(d.support) },
    range: { p: rangeP, trigger: `نوسان بین ${round2(M.range.low)} تا ${round2(M.range.high)} بدون شکست معتبر`, inv: 'شکست معتبر هر مرز رنج همراه با تأیید', entry: round2(M.range.mid), sl: round2(M.range.low) - 15, t1: round2(M.range.mid + (M.range.high - M.range.mid) * .4), t2: round2(M.range.high) - 10, t3: round2(M.range.high) }
  };
  const pricingIn = bullP >= bearP && bullP >= rangeP ? 'bullish' : bearP >= rangeP ? 'bearish' : 'neutral';
  const pricingLabel = pricingIn === 'bullish' ? scenarios.bullish.p : pricingIn === 'bearish' ? scenarios.bearish.p : scenarios.range.p;
  return `
    ${scenarioCard('سناریوی صعودی', '🟢', scenarios.bullish, 'var(--bullish)')}
    ${scenarioCard('سناریوی نزولی', '🔴', scenarios.bearish, 'var(--bearish)')}
    ${scenarioCard('سناریوی رنج', '🟡', scenarios.range, 'var(--neutral)')}
    <div class="card">
      <div class="card-title-row"><div class="card-title">بازار در حال حاضر کدام سناریو را قیمت‌گذاری می‌کند؟</div></div>
      <span class="tag ${IMP[pricingIn].c}" style="font-size:12.5px;padding:6px 14px">${IMP[pricingIn].l} — ${pricingLabel}% احتمال</span>
    </div>`;
}
function scenarioCard(title, emoji, d, color) {
  return `<div class="scenario-card">
    <div class="scenario-head"><span style="font-weight:700;font-size:13px">${emoji} ${title}</span><span class="tag" style="background:${color}22;color:${color}">${d.p}% احتمال</span></div>
    <div style="font-size:11.5px;color:var(--text-secondary);margin-bottom:8px;line-height:1.8"><b style="color:var(--text-primary)">Trigger:</b> ${d.trigger}</div>
    <div style="font-size:11.5px;color:var(--text-secondary);margin-bottom:10px;line-height:1.8"><b style="color:var(--text-primary)">Invalidation:</b> ${d.inv}</div>
    <div class="scenario-grid">

}

          <input type="range" min="0" max="100" id="w-${k}" value="${Math.round(settings.weights[k] * 100)}" style="width:100%"></div>`).join('')}
      <div class="field-hint">مجموع وزن‌ها هنگام ذخیره به‌صورت خودکار به ۱۰۰٪ نرمال‌سازی می‌شود.</div>
    </div>
    <div class="card">
      <div class="setting-row"><div><div class="setting-label">حالت تیره</div><div class="setting-desc">این نسخه صرفاً تم تیره را پشتیبانی می‌کند.</div></div>
        <label class="switch"><input type="checkbox" checked disabled><span class="switch-track"></span></label></div>
      <div class="setting-row"><div><div class="setting-label">اعلان‌ها</div><div class="setting-desc">هشدار برای رویدادهای مهم و تصمیم‌های شکارچی.</div></div>
        <label class="switch"><input type="checkbox" id="s-notif" ${settings.notifications ? 'checked' : ''}><span class="switch-track"></span></label></div>
    </div>
    <button class="btn" id="btn-save-settings">ذخیره تنظیمات</button>
    ${canInstall ? `<button class="btn btn-ghost" id="btn-install-pwa" style="margin-top:10px">📲 نصب روی صفحه اصلی گوشی</button>` : `<div class="field-hint" style="text-align:center;margin-top:10px">برای نصب: منوی مرورگر ← «Add to Home Screen» را بزنید.</div>`}
    <div class="field-hint" style="text-align:center;margin-top:8px">Gold Hunter v2.0.0 — Data: ${M ? STATUS_META[M.status].label : '—'}</div>`;
}

// =========================== 17. ROUTER + EVENT BINDING ===========================
let backtestCache = null;

async function render() {
  const el = document.getElementById('page');
  const statusTagEl = document.getElementById('global-status-tag');
  try {
    if (M && !M.unavailable) { statusTagEl.className = 'tag ' + STATUS_META[M.status].cls; statusTagEl.textContent = STATUS_META[M.status].label; }
    else if (M && M.unavailable) { statusTagEl.className = 'tag tag-unavailable'; statusTagEl.textContent = STATUS_META.UNAVAILABLE.label; }

    if (currentPage === 'dashboard') el.innerHTML = renderDashboard();
    else if (currentPage === 'technical') el.innerHTML = renderTechnical();
    else if (currentPage === 'fundamental') el.innerHTML = renderFundamental();
    else if (currentPage === 'risk') el.innerHTML = renderRisk();
    else if (currentPage === 'settings') el.innerHTML = renderSettings();
    else if (currentPage === 'chart') { el.innerHTML = renderChart(); initChart(); }
    else if (currentPage === 'ai') { el.innerHTML = renderAI(); if (!aiState.result && !aiState.loading) loadAI(); }
    else if (currentPage === 'alerts') el.innerHTML = renderAlerts();
    else if (currentPage === 'backtest') { el.innerHTML = renderBacktest(backtestCache, backtestIsDemo); if (!backtestCache) runBacktestNow(); }

    document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.page === currentPage));
    bindPageEvents();
  } catch (e) {
    // محافظ نهایی رندر: هرگز نباید صفحه برای همیشه خالی بماند — حتی اگر یک باگ پیش‌بینی‌نشده باشد،
    // پیام خطای قابل‌فهم و دکمه بازگشت/تلاش مجدد نشان بده.
    console.error('[gold-hunter] render() failed:', e);
    if (el) {
      el.innerHTML = `<div class="card"><div class="card-title-row"><div class="card-title">خطای غیرمنتظره در نمایش صفحه</div></div>
        <div class="state-box">یک خطای پیش‌بینی‌نشده رخ داد.<br><span class="mono" style="font-size:10px;word-break:break-all">${(e && e.message ? e.message : String(e)).replace(/</g, '&lt;')}</span></div>
        <button class="btn btn-ghost" id="btn-error-recover" style="margin-top:10px">🔄 بازگشت به داشبورد</button></div>`;
      const recoverBtn = document.getElementById('btn-error-recover');
      if (recoverBtn) recoverBtn.onclick = () => { currentPage = 'dashboard'; render(); };
    }
  }
}

async function loadAI() {
  aiState.loading = true; render();
  aiState.result = await getAIAnalysis(M, settings.useLive ? settings.apiBaseUrl : null);
  aiState.loading = false; render();
}

let backtestIsDemo = true;
async function runBacktestNow() {
  const provider = activeProviderFn();
  let ohlc = await provider.getOHLC(CONFIG.SYMBOL, '4H', 800);
  backtestIsDemo = !ohlc.bars || ohlc.status !== STATUS.LIVE;
  if (backtestIsDemo) ohlc = await demoProvider.getOHLC(CONFIG.SYMBOL, '4H', 800);
  backtestCache = ohlc.bars ? runBacktest(ohlc.bars) : { ok: false, reason: 'داده تاریخی در دسترس نیست.' };
  if (currentPage === 'backtest') render();
}

// کتابخانه نمودار فقط وقتی کاربر واقعاً وارد صفحه «نمودار زنده» می‌شود از CDN لود می‌شود —
// نه در بارگذاری اولیه اپ — تا اگر این CDN در دسترس/سریع نباشد، بقیه اپ (داشبورد، تکنیکال، ...)
// هرگز بلاک یا معطل نشود.
let _chartLibPromise = null;
function loadChartLib() {
  if (window.LightweightCharts) return Promise.resolve();
  if (_chartLibPromise) return _chartLibPromise;
  _chartLibPromise = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js';
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('chart-lib-load-failed'));
    document.head.appendChild(s);
    setTimeout(() => reject(new Error('chart-lib-timeout')), 12000);
  });
  return _chartLibPromise;
}

async function initChart() {
  const container = document.getElementById('chart-canvas');
  const rsiContainer = document.getElementById('rsi-canvas');
  if (!container) return;
  container.innerHTML = '<div class="state-box">در حال بارگذاری کتابخانه نمودار…</div>';
  try {
    await loadChartLib();
  } catch (e) {
    container.innerHTML = '<div class="state-box">کتابخانه نمودار در دسترس نیست (اتصال به CDN ناموفق بود). بقیه بخش‌های اپ بدون مشکل کار می‌کنند.</div>';
    return;
  }
  if (currentPage !== 'chart') return; // کاربر ممکن است تا زمان لود‌شدن، صفحه را عوض کرده باشد
  container.innerHTML = ''; rsiContainer.innerHTML = '';

  chartInstance = LightweightCharts.createChart(container, {
    width: container.clientWidth, height: 280,
    layout: { background: { color: 'transparent' }, textColor: '#99a3b5', fontFamily: 'JetBrains Mono' },
    grid: { vertLines: { color: 'rgba(255,255,255,.04)' }, horzLines: { color: 'rgba(255,255,255,.04)' } },
    rightPriceScale: { borderColor: 'rgba(212,175,55,.15)' },
    timeScale: { borderColor: 'rgba(212,175,55,.15)', timeVisible: true },
    handleScroll: true, handleScale: true
  });
  candleSeries = chartInstance.addCandlestickSeries({
    upColor: '#23c58f', downColor: '#e6495f', borderVisible: false,
    wickUpColor: '#23c58f', wickDownColor: '#e6495f'
  });
  volumeSeries = chartInstance.addHistogramSeries({
    color: '#8a93a8', priceFormat: { type: 'volume' }, priceScaleId: 'vol'
  });
  chartInstance.priceScale('vol').applyOptions({ scaleMargins: { top: 0.85, bottom: 0 } });
  emaSeries = chartInstance.addLineSeries({ color: '#d4af37', lineWidth: 2 });

  const rsiChart = LightweightCharts.createChart(rsiContainer, {
    width: rsiContainer.clientWidth, height: 90,
    layout: { background: { color: 'transparent' }, textColor: '#99a3b5' },
    grid: { vertLines: { visible: false }, horzLines: { color: 'rgba(255,255,255,.04)' } },
    rightPriceScale: { borderColor: 'rgba(212,175,55,.15)' },
    timeScale: { borderColor: 'rgba(212,175,55,.15)', visible: false }
  });
  const rsiSeries = rsiChart.addLineSeries({ color: '#e0b13d', lineWidth: 2 });

  loadChartData(chartTF, rsiSeries);
  window.addEventListener('resize', () => {
    if (currentPage !== 'chart' || !chartInstance) return;
    chartInstance.resize(container.clientWidth, 280);
    rsiChart.resize(rsiContainer.clientWidth, 90);
  });
}

async function loadChartData(tf, rsiSeries) {
  const provider = activeProviderFn();
  const ohlc = await provider.getOHLC(CONFIG.SYMBOL, tf, 200);
  const priceBox = document.getElementById('chart-price-box');
  if (ohlc.status === STATUS.UNAVAILABLE || !ohlc.bars || !ohlc.bars.length) {
    if (priceBox) priceBox.innerHTML = `<div class="state-box" style="grid-column:1/-1">داده زنده در دسترس نیست.</div>`;
    return;
  }
  const bars = ohlc.bars;
  candleSeries.setData(bars.map(b => ({ time: b.time, open: b.open, high: b.high, low: b.low, close: b.close })));
  volumeSeries.setData(bars.map(b => ({ time: b.time, value: b.volume, color: b.close >= b.open ? 'rgba(35,197,143,.5)' : 'rgba(230,73,95,.5)' })));

  const closes = bars.map(b => b.close);
  const emaPoints = []; let ema = closes[0]; const k = 2 / 21;
  for (let i = 0; i < bars.length; i++) { ema = closes[i] * k + ema * (1 - k); emaPoints.push({ time: bars[i].time, value: ema }); }
  emaSeries.setData(emaPoints);

  const rsiPoints = [];
  for (let i = 14; i < bars.length; i++) rsiPoints.push({ time: bars[i].time, value: calcRSI(closes.slice(0, i + 1), 14) });
  rsiSeries.setData(rsiPoints);

  const sr = calcSupportResistance(bars, 40);
  const last = bars[bars.length - 1];
  if (priceBox) {
    priceBox.innerHTML = `
      <div class="stat-box"><div class="stat-label">قیمت</div><div class="stat-value">${round2(last.close)}</div></div>
      <div class="stat-box"><div class="stat-label">وضعیت</div><div class="stat-value" style="font-size:11px">${STATUS_META[ohlc.status].label}</div></div>
      <div class="stat-box"><div class="stat-label">حمایت</div><div class="stat-value" style="color:var(--bullish)">${round2(sr.support)}</div></div>
      <div class="stat-box"><div class="stat-label">مقاومت</div><div class="stat-value" style="color:var(--bearish)">${round2(sr.resistance)}</div></div>`;
  }
}

function bindPageEvents() {
  document.querySelectorAll('[data-page]').forEach(b => b.onclick = () => { currentPage = b.dataset.page; render(); });
  document.querySelectorAll('[data-tf]').forEach(b => b.onclick = () => { techTab = b.dataset.tf; render(); });
  document.querySelectorAll('[data-risktab]').forEach(b => b.onclick = () => { riskTab = b.dataset.risktab; render(); });
  document.querySelectorAll('[data-charttf]').forEach(b => b.onclick = () => {
    chartTF = b.dataset.charttf; render();
  });

  const calcBtn = document.getElementById('btn-calc');
  if (calcBtn) calcBtn.onclick = () => {
    const f = {
      balance: parseFloat(document.getElementById('f-balance').value),
      risk: parseFloat(document.getElementById('f-risk').value),
      entry: parseFloat(document.getElementById('f-entry').value),
      sl: parseFloat(document.getElementById('f-sl').value),
      tp: parseFloat(document.getElementById('f-tp').value) || 0,
      lev: parseFloat(document.getElementById('f-lev').value),
    };
    const res = calcPositionSize(f);
    const box = document.getElementById('calc-result');
    if (!res.valid) {
      box.innerHTML = `<div class="card"><div class="card-title-row"><div class="card-title">خطا در ورودی‌ها</div></div>
        ${res.errors.map(e => `<div style="font-size:12px;color:var(--bearish);margin-bottom:4px">• ${e}</div>`).join('')}</div>`;
    } else {
      box.innerHTML = `<div class="card"><div class="card-title-row"><div class="card-title">نتیجه محاسبه</div></div>
        <div class="stat-grid">
          <div class="stat-box"><div class="stat-label">مقدار ریسک</div><div class="stat-value">$${res.riskAmount}</div></div>
          <div class="stat-box"><div class="stat-label">فاصله حد ضرر</div><div class="stat-value">${res.stopDist}</div></div>
          <div class="stat-box"><div class="stat-label">حجم پوزیشن (اونس)</div><div class="stat-value">${res.size}</div></div>
          <div class="stat-box"><div class="stat-label">ارزش کل معامله</div><div class="stat-value">$${res.notional}</div></div>
          <div class="stat-box"><div class="stat-label">مارجین موردنیاز</div><div class="stat-value">$${res.margin}</div></div>
          ${res.rr ? `<div class="stat-box"><div class="stat-label">نسبت R</div><div class="stat-value">1:${res.rr}</div></div>` : ''}
        </div>
        ${res.rr ? `<div style="margin-top:14px">${res.acceptable ? '<span class="tag tag-bullish" style="font-size:12.5px;padding:6px 14px">🟢 R قابل قبول است</span>' : '<span class="tag tag-bearish" style="font-size:12.5px;padding:6px 14px">🔴 ورود ممنوع — R کمتر از حداقل مجاز است</span>'}</div>` : ''}
      </div>`;
    }
  };
  const addTradeBtn = document.getElementById('btn-add-trade');
  if (addTradeBtn) addTradeBtn.onclick = () => {
    const t = {
      id: Date.now(), pair: document.getElementById('j-pair').value || 'XAU/USD',
      dir: document.getElementById('j-dir').value, entry: document.getElementById('j-entry').value,
      sl: document.getElementById('j-sl').value, pl: document.getElementById('j-pl').value,
    };
    journal.unshift(t); setLS('gh_journal', journal); render();
  };
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    journal = journal.filter(t => t.id !== parseInt(b.dataset.del)); setLS('gh_journal', journal); render();
  });
  const saveSettingsBtn = document.getElementById('btn-save-settings');
  if (saveSettingsBtn) saveSettingsBtn.onclick = () => {
    const rawWeights = {};
    ['technical', 'fundamental', 'regime', 'riskReward', 'news'].forEach(k => {
      const el = document.getElementById('w-' + k);
      rawWeights[k] = el ? parseFloat(el.value) : settings.weights[k] * 100;
    });
    const sum = Object.values(rawWeights).reduce((a, b) => a + b, 0) || 1;
    const normWeights = {};
    Object.keys(rawWeights).forEach(k => normWeights[k] = rawWeights[k] / sum);

    settings = {
      ...settings,
      accountBalance: parseFloat(document.getElementById('s-balance').value) || settings.accountBalance,
      riskPercent: parseFloat(document.getElementById('s-risk').value) || settings.riskPercent,
      leverage: parseFloat(document.getElementById('s-lev').value) || settings.leverage,
      notifications: document.getElementById('s-notif').checked,
      apiBaseUrl: document.getElementById('s-apibase').value.trim(),
      useLive: document.getElementById('s-uselive').checked,
      quoteProvider: document.getElementById('s-quoteprovider').checked ? 'xaus' : 'none',
      weights: normWeights
    };
    setLS('gh_settings', settings);
    saveSettingsBtn.textContent = '✓ ذخیره شد';
    refreshState();
    setTimeout(() => { saveSettingsBtn.textContent = 'ذخیره تنظیمات'; }, 1200);
  };
  const installBtn = document.getElementById('btn-install-pwa');
  if (installBtn) installBtn.onclick = async () => {
    if (!window.__deferredInstallPrompt) return;
    window.__deferredInstallPrompt.prompt();
    await window.__deferredInstallPrompt.userChoice;
    window.__deferredInstallPrompt = null;
  };
  const refreshAiBtn = document.getElementById('btn-refresh-ai');
  if (refreshAiBtn) refreshAiBtn.onclick = () => { aiState.result = null; loadAI(); };
  const rerunBacktestBtn = document.getElementById('btn-rerun-backtest');
  if (rerunBacktestBtn) rerunBacktestBtn.onclick = () => { backtestCache = null; demoProvider.regenerate(); runBacktestNow(); render(); };
  const retryBtn = document.getElementById('btn-retry-connection');
  if (retryBtn) retryBtn.onclick = () => { retryBtn.textContent = 'در حال تلاش…'; refreshState(); };
  const diagnoseBtn = document.getElementById('btn-diagnose');
  if (diagnoseBtn) diagnoseBtn.onclick = async () => {
    const box = document.getElementById('diagnose-box');
    box.innerHTML = `<div class="field-hint" style="margin-top:10px">در حال تست اتصال از همین گوشی…</div>`;
    const p = new XausProvider();
    const t0 = performance.now();
    const spotRaw = await p._get('/spot?compact=1');
    const t1 = performance.now();
    const histRaw = await p._get('/history');
    const t2 = performance.now();
    const fmt = (v) => v == null ? '<span style="color:var(--bearish)">null / خطا در دریافت</span>' : `<pre style="white-space:pre-wrap;word-break:break-all;font-size:10px;line-height:1.6;margin:0">${JSON.stringify(v, null, 1).slice(0, 900)}</pre>`;
    box.innerHTML = `
      <div class="field-hint" style="margin-top:10px">
        <b>GET /spot</b> — ${Math.round(t1 - t0)}ms — ${spotRaw ? '<span style="color:var(--bullish)">موفق ✓</span>' : '<span style="color:var(--bearish)">شکست ✗ (' + (p.lastError || 'نامشخص') + ')</span>'}<br>
        ${fmt(spotRaw)}
      </div>
      <div class="field-hint" style="margin-top:10px">
        <b>GET /history</b> — ${Math.round(t2 - t1)}ms — ${histRaw ? '<span style="color:var(--bullish)">موفق ✓ (' + (histRaw.points ? histRaw.points.length : 0) + ' نقطه)</span>' : '<span style="color:var(--bearish)">شکست ✗ (' + (p.lastError || 'نامشخص') + ')</span>'}<br>
        ${histRaw && histRaw.points ? fmt(histRaw.points.slice(-3)) : fmt(histRaw)}
      </div>
      <div class="field-hint" style="margin-top:6px">این پاسخ خام مستقیماً از گوشی توست — کپی و برام بفرست تا دقیقاً بفهمم مشکل کجاست.</div>`;
  };
  const diagnoseProxyBtn = document.getElementById('btn-diagnose-proxy');
  if (diagnoseProxyBtn) diagnoseProxyBtn.onclick = async () => {
    const box = document.getElementById('diagnose-proxy-box');
    const urlInput = document.getElementById('s-apibase');
    const baseUrl = (urlInput ? urlInput.value : settings.apiBaseUrl || '').trim().replace(/\/$/, '');
    if (!baseUrl) { box.innerHTML = `<div class="field-hint" style="margin-top:10px;color:var(--bearish)">اول آدرس Backend Proxy را در فیلد بالا وارد کن.</div>`; return; }
    box.innerHTML = `<div class="field-hint" style="margin-top:10px">در حال تست اتصال به <span class="mono">${baseUrl}</span> — ممکن است تا ۴۵ ثانیه طول بکشد (اگر سرور خواب بوده، بیدار می‌شود)…</div>`;
    const p = new RestApiDataProvider(baseUrl);
    const t0 = performance.now();
    const health = await p._get('/api/health', 45000);
    const t1 = performance.now();
    const quote = await p.getQuote(CONFIG.SYMBOL);
    const t2 = performance.now();
    const daily = await p.getOHLC(CONFIG.SYMBOL, 'Daily', 200);
    const t3 = performance.now();
    const weekly = await p.getOHLC(CONFIG.SYMBOL, 'Weekly', 200);
    const t4 = performance.now();
    const fmt = (v) => {
      const s = JSON.stringify(v, null, 1);
      return `<pre style="white-space:pre-wrap;word-break:break-all;font-size:10px;line-height:1.6;margin:0">${(s || '').slice(0, 500)}${v && v.bars ? ' …(' + v.bars.length + ' کندل)' : ''}</pre>`;
    };
    const ok = (v) => v && v.status !== STATUS.UNAVAILABLE;
    const row = (label, ms, v) => `<div class="field-hint" style="margin-top:10px">
        <b>${label}</b> — ${Math.round(ms)}ms — ${ok(v) ? '<span style="color:var(--bullish)">موفق ✓</span>' : '<span style="color:var(--bearish)">شکست ✗ (' + (v && v.error ? v.error : 'نامشخص') + ')</span>'}<br>
        ${fmt(v)}
      </div>`;
    box.innerHTML = row('GET /api/health', t1 - t0, health && health.ok ? { status: 'LIVE' } : { status: 'UNAVAILABLE', error: health && health.error })
      + row('GET /api/market/quote', t2 - t1, quote)
      + row('GET /api/market/ohlc (Daily)', t3 - t2, daily)
      + row('GET /api/market/ohlc (Weekly)', t4 - t3, weekly)
      + `<div class="field-hint" style="margin-top:6px">اگر «no-api-key-configured» دیدی، یعنی TWELVEDATA_API_KEY درست ثبت نشده. اگر خطای دیگری (مثل rate limit) دیدی، همین پاسخ رو کپی و برام بفرست.</div>`;

// =========================== 18. BOOTSTRAP ===========================
async function refreshState() {
  try {
    M = await buildMarketState();
  } catch (e) {
    // محافظ نهایی: حتی یک خطای کاملاً غیرمنتظره هم نباید صفحه را برای همیشه خالی نگه دارد —
    // به‌جای هنگ‌کردن، حداقل روی DEMO باز می‌گردیم تا اپ همیشه قابل‌استفاده بماند.
    console.error('[gold-hunter] buildMarketState failed unexpectedly:', e);
    try { M = await (async () => {
      const q = await demoProvider.getQuote(CONFIG.SYMBOL);
      const techByTF = {};
      for (const tf of TIMEFRAMES) { const o = await demoProvider.getOHLC(CONFIG.SYMBOL, tf, 200); techByTF[tf] = buildTechnicalFrame(o.bars); techByTF[tf].source = STATUS.DEMO; }
      const regime = detectRegime(techByTF);
      const breakout = evaluateBreakout(techByTF, techByTF['Daily'].resistance);
      const range = evaluateRange(techByTF);
      const cal = await demoProvider.getEconomicCalendar();
      const newsRisk = evaluateNewsRisk(cal);
      const fundamental = evaluateFundamental(cal.events || []);
      const decision = runRuleEngine({ techByTF, regime, breakout, range, newsRisk, fundamental });
      const hunter = calcHunterScore({ techByTF, regime, decision, newsRisk, fundamental }, settings.weights);
      return { unavailable: false, status: STATUS.DEMO, quote: q, techByTF, regime, breakout, range, newsRisk, fundamental, decision, scores: hunter.scores, hunterScore: hunter.hunterScore, calendarResult: cal, technicalIsDemo: true, quoteError: 'recovered-from-error: ' + (e && e.message) };
    })(); } catch (e2) { M = { unavailable: true, status: STATUS.UNAVAILABLE, quote: { status: STATUS.UNAVAILABLE }, calendarResult: { status: STATUS.UNAVAILABLE, events: [] } }; }
  }
  aiState.result = null;
  render();
}
refreshState();
